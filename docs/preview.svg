<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Three volume pricing tiers, with the middle tier selected">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="40" y="52" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#111111">Buy more, save more</text>

  <!-- Tier 1 -->
  <rect x="40" y="72" width="200" height="104" rx="10" fill="none" stroke="#d9dce1"/>
  <text x="60" y="102" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111111">Buy 1+</text>
  <text x="60" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#111111">$20.00</text>
  <text x="118" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">each</text>
  <text x="60" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">$20.00</text>

  <!-- Tier 2 (selected) -->
  <rect x="260" y="72" width="200" height="104" rx="10" fill="#1f2937" fill-opacity="0.08" stroke="#1f2937" stroke-width="2"/>
  <rect x="276" y="62" width="102" height="20" rx="10" fill="#1f2937"/>
  <text x="288" y="76" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ffffff">Most popular</text>
  <text x="280" y="102" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111111">Buy 3+</text>
  <text x="280" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#111111">$18.00</text>
  <text x="338" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">each</text>
  <text x="280" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#111111">Save 10%</text>
  <text x="342" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-decoration="line-through">$60.00</text>
  <text x="394" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">$54.00</text>

  <!-- Tier 3 -->
  <rect x="480" y="72" width="200" height="104" rx="10" fill="none" stroke="#d9dce1"/>
  <text x="500" y="102" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111111">Buy 6+</text>
  <text x="500" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#111111">$17.00</text>
  <text x="558" y="130" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">each</text>
  <text x="500" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#111111">Save 15%</text>
  <text x="562" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280" text-decoration="line-through">$120.00</text>
  <text x="622" y="154" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">$102.00</text>

  <text x="40" y="206" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#6b7280">Discounts are applied automatically at checkout.</text>
</svg>
